<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ARC logo</title>
  <desc id="desc">Three concentric arcs in amber, blue, and teal converging above a small dot, with the wordmark ARC and the tagline Access Risk Care below.</desc>
  <rect width="680" height="340" fill="#ffffff"/>
  <path d="M230 220 A110 110 0 0 1 450 220" fill="none" stroke="#d97706" stroke-width="12" stroke-linecap="round"/>
  <path d="M255 220 A85 85 0 0 1 425 220" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <path d="M280 220 A60 60 0 0 1 400 220" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round"/>
  <circle cx="340" cy="220" r="8" fill="#1f2937"/>
  <text x="340" y="286" text-anchor="middle" font-size="44" font-weight="600" font-family="Arial, Helvetica, sans-serif" fill="#111827">ARC</text>
  <text x="340" y="310" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#4b5563" letter-spacing="2">ACCESS &#183; RISK &#183; CARE</text>
</svg>
